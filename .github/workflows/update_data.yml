name: Automatyczna aktualizacja danych (Ebola DRC)

on:
  schedule:
    # Uruchamia się co dwa tygodnie (1. i 15. dnia każdego miesiąca o 06:00 UTC)
    - cron: '0 6 1,15 * *'
  
  # Pozwala uruchomić skrypt ręcznie w dowolnym momencie z zakładki "Actions" na GitHubie
  workflow_dispatch:

permissions:
  # Nadaje workflow uprawnienia do zapisu nowych plików (commit) w repozytorium
  contents: write

jobs:
  fetch-and-commit-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Pobranie aktualnego stanu repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalacja wymaganych bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: 4. Uruchomienie skryptu pobierającego dane
        run: |
          python scripts/fetch_data.py

      - name: 5. Zapisanie nowych danych w repozytorium (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/01_bronze_raw/
          # Zatwierdza i wypycha zmiany tylko wtedy, gdy pojawiły się nowe lub zmienione pliki
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automatyczna aktualizacja warstwy Bronze [skip ci]" && git push)
